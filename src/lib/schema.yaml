# yaml-language-server: $schema=https://json-schema.org/draft-07/schema

$schema: http://json-schema.org/draft-07/schema#
$id: http://jarrodldavis.com/schema.json#
title: jarrodldavis.com resume schema

definitions:
  highlight:
    type: object
    required: [content]
    additionalProperties: false
    properties:
      title:
        type: string
      content:
        oneOf:
          - type: string
          - type: array
            items:
              type: string
      omit:
        $ref: '#/definitions/omit'
  location:
    type: object
    required: [city, state, remote]
    additionalProperties: false
    properties:
      city:
        type: string
      state:
        type: string
      remote:
        type: boolean
  omit:
    type: array
    items:
      type: string
      enum: [pdf]

type: object
required: [profile, work, education, projects, skills]
additionalProperties: false
properties:
  profile:
    type: object
    required: [name, titles, location, email, url, networks, intro]
    additionalProperties: false
    properties:
      name:
        type: string
      titles:
        type: array
        items:
          type: string
      location:
        $ref: '#/definitions/location'
      email:
        type: string
        format: email
      url:
        type: string
        format: uri
      networks:
        type: array
        items:
          type: object
          required: [network, username, url]
          additionalProperties: false
          properties:
            network:
              type: string
            username:
              type: string
            url:
              type: string
              format: uri
      intro:
        type: string

  work:
    type: array
    items:
      type: object
      required: [company, url, location, positions]
      additionalProperties: false
      properties:
        company:
          type: string
        url:
          type: [string, 'null']
          format: uri
        location:
          $ref: '#/definitions/location'
        omit:
          $ref: '#/definitions/omit'
        positions:
          type: array
          items:
            type: object
            required: [title, summary, start_date, end_date, highlights]
            additionalProperties: false
            properties:
              title:
                type: string
              summary:
                type: string
              start_date:
                type: string
                format: date
              end_date:
                type: [string, 'null']
                format: date
              omit:
                $ref: '#/definitions/omit'
              highlights:
                type: array
                items:
                  $ref: '#/definitions/highlight'

  education:
    type: array
    items:
      type: object
      required:
        - institution
        - url
        - location
        - degree
        - major
        - start_date
        - end_date
        - honors
        - courses
        - highlights
      additionalProperties: false
      properties:
        institution:
          type: string
        url:
          type: [string, 'null']
          format: uri
        location:
          $ref: '#/definitions/location'
        degree:
          type: string
        major:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: [string, 'null']
          format: date
        honors:
          type: array
          items:
            type: string
        courses:
          type: array
          items:
            type: string
        omit:
          $ref: '#/definitions/omit'
        highlights:
          type: array
          items:
            $ref: '#/definitions/highlight'

  projects:
    type: array
    items:
      type: object
      required: [name, url, start_date, end_date, affiliation, highlights]
      additionalProperties: false
      properties:
        name:
          type: string
        url:
          type: [string, 'null']
          format: uri
        affiliation:
          type: [string]
        start_date:
          type: string
          format: date
        end_date:
          type: [string, 'null']
          format: date
        omit:
          $ref: '#/definitions/omit'
        highlights:
          type: array
          items:
            $ref: '#/definitions/highlight'

  skills:
    type: array
    items:
      type: object
      required: [category, skills]
      additionalProperties: false
      properties:
        category:
          type: string
        skills:
          type: array
          minItems: 1
          items:
            type: string
